<section class="p-6">
  <h1 class="text-2xl font-semibold">Organizations</h1>
  @if (error()) {
    <div class="alert alert-error mt-3">{{ error() }}</div>
  }
  <ul class="menu bg-base-100 rounded-box mt-4">
    @for (org of organizations(); track org.id) {
      <li>{{ org.name }} ({{ org.status }})</li>
    }
  </ul>
</section>
