@if (showBootstrapBanner()) {
  <div class="alert alert-warning rounded-none justify-center" role="status" aria-live="polite">
    <span>Bootstrap mode active: create the initial admin account to continue.</span>
  </div>
}

@if (showAuthenticatedShell()) {
  <app-authenticated-shell>
    <router-outlet />
  </app-authenticated-shell>
} @else {
  <router-outlet />
}
