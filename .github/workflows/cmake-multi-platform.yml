# SPDX-License-Identifier: MPL-2.0
name: Dockerized Linux packages

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  target-matrix:
    name: Validate initial target matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Check out the workflow revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate target inputs
        id: matrix
        shell: bash
        run: printf 'value=%s\n' "$(python3 packaging/scripts/package_identity.py --matrix)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.id }} (${{ matrix.package_format }})
    needs: target-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.target-matrix.outputs.matrix) }}
    timeout-minutes: 360
    steps:
      - name: Check out the same workflow revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm Buildx availability
        run: docker buildx version
      - name: Build and verify target packages
        env:
          ISCHED_TARGET: ${{ matrix.id }}
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          python3 packaging/scripts/build_local.py \
            --target "$ISCHED_TARGET" \
            --revision "$revision" \
            --output "dist/$ISCHED_TARGET"
      - name: Validate and stage both package roles (${{ matrix.id }})
        id: artifacts
        env:
          ISCHED_TARGET: ${{ matrix.id }}
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          python3 packaging/scripts/prepare_artifacts.py \
            --target "$ISCHED_TARGET" \
            --revision "$revision" \
            --directory "dist/$ISCHED_TARGET" \
            --output-dir "dist/artifacts/$ISCHED_TARGET" \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload runtime artifact (${{ matrix.id }})
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifacts.outputs.runtime_artifact_name }}
          path: dist/artifacts/${{ matrix.id }}/runtime/
          if-no-files-found: error
      - name: Upload developer artifact (${{ matrix.id }})
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifacts.outputs.developer_artifact_name }}
          path: dist/artifacts/${{ matrix.id }}/developer/
          if-no-files-found: error
